# The IPC key of dmix or dsnoop plugin must be unique
# If 555555 or 666666 is used by other processes, use another one


# use samplerate to resample as speexdsp resample is bad
defaults.pcm.rate_converter "samplerate"

pcm.!default {
    type asym
    playback.pcm "playback"
    capture.pcm "capture"
}

pcm.playback {
    type plug
    slave.pcm "swap_lr"
}

# El esquematico del Audio HAT rotula al reves las salidas del codec: la etiqueta
# /HP_L esta sobre el pin 29, que el simbolo del WM8960 llama HP_R, y viceversa. El
# error se propaga por toda la cadena de nombres, asi que el jack serigrafiado
# "LINE OUT L" saca el canal derecho.
#
# Esto lo compensa en reproduccion. Las ENTRADAS estan bien y no se tocan.
#
# Ojo: sirve para lo que abre "default" — Pure Data y cualquier app normal. Lo que
# abre "hw:" directo se salta esta capa y sigue cruzado.
#
# Se saca cuando salga una revision con las etiquetas corregidas.
pcm.swap_lr {
    type route
    slave.pcm "dmixed"
    slave.channels 2
    ttable.0.1 1
    ttable.1.0 1
}

pcm.capture {
    type plug
    slave.pcm "array"
}

pcm.dmixed {
    type dmix
    slave.pcm "hw:wm8960soundcard"
    ipc_key 555555 
}

pcm.array {
    type dsnoop
    slave {
        pcm "hw:wm8960soundcard"
        channels 2
    }
    ipc_key 666666
}

